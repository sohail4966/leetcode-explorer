spring.application.name=leetcode-explorer
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/leetcode_explorer
spring.datasource.username=${USER}
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# Sync Worker
sync.repo-url=https://github.com/liquidslr/leetcode-company-wise-problems.git
sync.branch=main
sync.interval-hours=6
sync.enabled=true
