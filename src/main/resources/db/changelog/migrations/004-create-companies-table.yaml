databaseChangeLog:
  - changeSet:
      id: 004-create-companies-table
      author: sohailmulla
      changes:
        - createTable:
            tableName: companies
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
                    unique: true
