databaseChangeLog:
  - changeSet:
      id: 002-create-topics-table
      author: sohailmulla
      changes:
        - createTable:
            tableName: topics
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
